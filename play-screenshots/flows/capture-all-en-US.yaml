appId: com.nblaisot.voxcrew
---
# English (en-US) continuous capture. Filenames use _US suffix.
# Locale: adb set-app-locales + launch argument locale=en-US (API 33+).
- launchApp:
    clearState: true
    arguments:
      locale: "en-US"
- extendedWaitUntil:
    visible: "Choose a name visible to nearby crewmates."
    timeout: 20000
- tapOn:
    id: "profile_name_field"
- eraseText
- inputText: "Nicolas"
- hideKeyboard
- takeScreenshot: 01-profile-name_US

- tapOn:
    id: "profile_continue"
- extendedWaitUntil:
    visible: "Participants"
    timeout: 20000
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

- launchApp:
    clearState: false
    stopApp: true
    arguments:
      enable_demo: "true"
      locale: "en-US"
- extendedWaitUntil:
    visible: "Marc"
    timeout: 20000
- extendedWaitUntil:
    visible: "Anne"
    timeout: 5000
- extendedWaitUntil:
    visible: "Quentin"
    timeout: 5000
- extendedWaitUntil:
    visible: "Vox on — listening"
    timeout: 15000
- takeScreenshot: 02-main-crew-demo_US

- tapOn:
    id: "main_audio_route"
- extendedWaitUntil:
    visible: "Nicolas' earbuds"
    timeout: 5000
- extendedWaitUntil:
    visible: "Galaxy Watch 8"
    timeout: 5000
- takeScreenshot: 03-audio-bluetooth_US
- back

- extendedWaitUntil:
    visible:
      id: "crew_marc"
    timeout: 10000
- doubleTapOn:
    id: "crew_marc"
- takeScreenshot: 04-solo-marc_US

- extendedWaitUntil:
    visible: "Vox on — listening"
    timeout: 5000
- takeScreenshot: 05-vox-bluetooth-ptt_US

- extendedWaitUntil:
    visible:
      id: "crew_quentin"
    timeout: 10000
- longPressOn:
    id: "crew_quentin"
- extendedWaitUntil:
    visible: "Forget Quentin?"
    timeout: 5000
- takeScreenshot: 06-forget-quentin_US
